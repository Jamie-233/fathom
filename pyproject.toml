[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fathom"
version = "0.3.0"
description = "An AIOps platform for networks: inventory, telemetry, topology-aware root cause analysis, event-driven remediation, declarative config and an LLM agent — with a built-in simulated network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamie" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fathom = "fathom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fathom = ["ops/static/*", "config/templates/*", "ai/knowledge/*", "devices/lab.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
